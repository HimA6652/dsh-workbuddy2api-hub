url: https://github.com/HimA6652/dsh-workbuddy2api-hub
name: HimA6652/dsh-workbuddy2api-hub
category: model
description:
  en: Registers the models of a local workbuddy2api-hub gateway as an OpenAI-compatible provider in DSH, signing in with the gateway's panel password or an API key already in the credential store, and shows the gateway's credit balance plus today's and this week's tokens, credits and API-equivalent cost in a sidebar badge. Requires workbuddy2api-hub running locally.
  zh: 把本地 workbuddy2api-hub 网关的模型注册成 DSH 的 OpenAI 兼容 provider：用网关的面板密码登录，或复用凭据库里已有的 API Key；侧边栏徽标显示网关的积分余额与今日、本周的 tokens、积分消耗与 API 等价花费。需本机运行 workbuddy2api-hub。
